name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Set the CUSTOM_DOMAIN repository variable (e.g. www.grupoangbu.com) once its DNS
      # points at GitHub Pages; until then the site is served from the project URL.
      CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Build
        run: |
          if [ -n "$CUSTOM_DOMAIN" ]; then
            export BASE_PATH=/ VITE_SITE_URL="https://$CUSTOM_DOMAIN/"
          else
            export BASE_PATH=/${GITHUB_REPOSITORY#*/}/ VITE_SITE_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          fi
          npx tsc
          npx vite build --base="$BASE_PATH"
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
          if [ -n "$CUSTOM_DOMAIN" ]; then echo "$CUSTOM_DOMAIN" > dist/CNAME; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
